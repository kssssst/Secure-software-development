name: CI/CD Pipeline with TLS

on:
  push:
    branches: [ main, Lab_6 ]
  pull_request:
    branches: [ main ]

env:
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: marketdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create SSL directory structure
        run: |
          echo "Creating SSL directory for keystore..."
          mkdir -p src/main/resources/ssl

      - name: Generate keystore from secret
        run: |
          echo "Generating keystore from GitHub Secret..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > src/main/resources/ssl/studentlab.p12
          echo "Keystore file created successfully"
          ls -la src/main/resources/ssl/
          echo "Keystore size:" $(wc -c < src/main/resources/ssl/studentlab.p12) "bytes"

      - name: Setup PostgreSQL connection for tests
        run: |
          echo "Configuring PostgreSQL for tests..."
          echo "spring.datasource.url=jdbc:postgresql://localhost:5432/marketdb" > test.properties
          echo "spring.datasource.username=postgres" >> test.properties
          echo "spring.datasource.password=postgres" >> test.properties
          echo "spring.datasource.driver-class-name=org.postgresql.Driver" >> test.properties
          echo "spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect" >> test.properties
          echo "spring.jpa.hibernate.ddl-auto=create-drop" >> test.properties

      - name: Build with Maven
        run: mvn -B clean compile

      - name: Run tests
        run: mvn -B test -Dspring.datasource.url=jdbc:postgresql://localhost:5432/marketdb -Dspring.datasource.username=postgres -Dspring.datasource.password=postgres