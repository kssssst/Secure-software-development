# ============ JWT Configuration ============
jwt.secret=your-256-bit-secret-key-must-be-at-least-32-characters-long
jwt.access.expiration=900000
jwt.refresh.expiration=604800000
jwt.issuer=market-app

# ============ TLS/HTTPS Configuration ============
server.port=8443
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:ssl/studentlab.p12
server.ssl.key-store-password=${KEYSTORE_PASSWORD:studentlab123}
server.ssl.key-alias=studentlab
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# Optional: HTTP port for redirect
server.http.port=8081

# Debug SSL if needed
